version: '3'

tasks:
  default:
    desc: Build all modules
    cmds:
      - task: build

  build:
    desc: Build root, tools, and x modules
    cmds:
      - go build -v ./...
      - cmd: cd tools && go build -v ./...
      - cmd: cd x && go build -v ./...

  test:
    desc: Run unit tests across modules
    cmds:
      - go test -race -v -coverprofile=coverage.txt -covermode=atomic $(go list ./... | grep -v /internal/integrationtest)
      - cmd: cd tools && go test -race -v ./...
      - cmd: cd x && go test -race -v ./...

  itest:
    desc: Run containerized integration tests using testcontainers-go
    cmds:
      - go test -v -timeout 300s ./internal/integrationtest/...

  bench:
    desc: Run benchmarks
    cmds:
      - go test -run=^$ -bench=. -loglevel=debug ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  proto:
    desc: Generate protobuf code
    sources:
      - internal/proto/wasq.proto
    generates:
      - internal/proto/wasq.pb.go
    cmds:
      - >-
        protoc -I=internal/proto
        --go_out=internal/proto
        --go_opt=module=github.com/nirantarasi/wasq/internal/proto
        internal/proto/wasq.proto

  tidy:
    desc: Run go mod tidy across all modules
    cmds:
      - go mod tidy
      - cmd: cd tools && go mod tidy
      - cmd: cd x && go mod tidy
